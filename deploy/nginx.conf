# Конфигурация nginx для лендинга Kronto (статический сайт).
#
# Куда положить: /etc/nginx/sites-available/kronto  (+ симлинк в sites-enabled)
# или /etc/nginx/conf.d/kronto.conf. Файл подключается внутри блока http {}.
#
# Перед использованием замените [домен] на ваш домен, например kronto.ru.
# Пошаговая инструкция — в DEPLOY.md.

# Кэш: файлы из /assets/ — на год (при изменении увеличьте ?v= в index.html),
# HTML — всегда перепроверять.
map $uri $kronto_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

# ─────────────────────────────────────────────────────────────
# ЭТАП 1. HTTP. Работает сразу после установки, нужен для выпуска сертификата.
# После выпуска сертификата (DEPLOY.md, шаг 6) закомментируйте этот блок
# и раскомментируйте блоки ЭТАПА 2 ниже.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name [домен] www.[домен];

    # www → без www
    if ($host = www.[домен]) {
        return 301 http://[домен]$request_uri;
    }

    include /etc/nginx/snippets/kronto-site.conf;
}

