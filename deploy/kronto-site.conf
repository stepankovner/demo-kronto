# Общие настройки сайта Kronto. Подключается из nginx.conf через include.
# Куда положить: /etc/nginx/snippets/kronto-site.conf

root /var/www/kronto;
index index.html;
charset utf-8;

error_page 404 /404.html;

# ── сжатие ──
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;
# text/html сжимается всегда, указывать его в gzip_types не нужно

# ── заголовки ──
# nginx не наследует add_header во вложенные location, поэтому все заголовки заданы здесь,
# а в location ниже add_header не используется.
add_header Cache-Control $kronto_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# На сайте нет inline-скриптов и inline-стилей, поэтому политика строгая.
# Если подключите Яндекс Метрику — добавьте https://mc.yandex.ru в script-src, img-src и connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

location / {
    try_files $uri $uri/ =404;
}

location = /404.html {
    internal;
}

# служебные файлы не отдаём
location ~ /\.(?!well-known) {
    deny all;
}
location ~* \.(md|sh)$ {
    deny all;
}
