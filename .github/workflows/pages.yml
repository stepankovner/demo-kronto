# Публикация сайта на GitHub Pages (домен krontoai.ru, см. DEPLOY.md).
# Запускается при каждом пуше в main и вручную из вкладки Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # На сайт уходят только файлы сайта: без deploy/, .md и служебных папок
      - name: Собрать папку сайта
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml CNAME assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
